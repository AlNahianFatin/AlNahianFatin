<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Animated software engineer workstation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity=".35"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="226" y="66" width="0" height="24"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;.05;.20;1" values="0;0;290;290"/></rect></clipPath>
    <clipPath id="c2"><rect x="226" y="92" width="0" height="24"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;.22;.34;1" values="0;0;220;220"/></rect></clipPath>
    <clipPath id="c3"><rect x="226" y="118" width="0" height="24"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;.36;.47;1" values="0;0;200;200"/></rect></clipPath>
    <clipPath id="c4"><rect x="226" y="144" width="0" height="24"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;.49;.52;1" values="0;0;40;40"/></rect></clipPath>
    <clipPath id="c5"><rect x="226" y="170" width="0" height="24"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;.54;.70;1" values="0;0;250;250"/></rect></clipPath>
  </defs>

  <rect width="800" height="320" rx="18" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#c0caf5">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="50" r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="120" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="180" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="200" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- monitor glow -->
  <ellipse cx="400" cy="150" rx="260" ry="130" fill="url(#glow)"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></ellipse>

  <!-- monitor -->
  <rect x="196" y="28" width="408" height="214" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="2"/>
  <rect x="208" y="40" width="384" height="190" rx="6" fill="#1a1b27"/>
  <rect x="208" y="40" width="384" height="20" rx="6" fill="#16161e"/>
  <circle cx="224" cy="50" r="4" fill="#f7768e"/><circle cx="240" cy="50" r="4" fill="#e0af68"/><circle cx="256" cy="50" r="4" fill="#9ece6a"/>
  <text x="400" y="54" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#565f89">engineer.js</text>

  <!-- code -->
  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" xml:space="preserve">
    <g clip-path="url(#c1)"><text x="226" y="84"><tspan fill="#bb9af7">const</tspan><tspan fill="#c0caf5"> dev = </tspan><tspan fill="#9ece6a">"Al Nahian Fatin"</tspan><tspan fill="#89ddff">;</tspan></text></g>
    <g clip-path="url(#c2)"><text x="226" y="110"><tspan fill="#bb9af7">function</tspan><tspan fill="#7aa2f7"> build</tspan><tspan fill="#c0caf5">(idea) {</tspan></text></g>
    <g clip-path="url(#c3)"><text x="226" y="136"><tspan fill="#bb9af7">  return</tspan><tspan fill="#7aa2f7"> ship</tspan><tspan fill="#c0caf5">(idea)</tspan><tspan fill="#89ddff">;</tspan></text></g>
    <g clip-path="url(#c4)"><text x="226" y="162"><tspan fill="#c0caf5">}</tspan></text></g>
    <g clip-path="url(#c5)"><text x="226" y="188"><tspan fill="#7aa2f7">build</tspan><tspan fill="#c0caf5">(</tspan><tspan fill="#9ece6a">"something great"</tspan><tspan fill="#c0caf5">)</tspan><tspan fill="#89ddff">;</tspan></text></g>
  </g>
  <!-- cursor, appears after typing finishes -->
  <g>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;.70;.701;1" values="0;0;1;1"/>
    <rect x="480" y="174" width="8" height="16" fill="#c0caf5"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <text x="226" y="214" font-family="Consolas, Menlo, monospace" font-size="12" fill="#9ece6a">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;.74;.75;.95;1" values="0;0;1;1;0"/>✔ build passed
  </text>

  <!-- stand, base, keyboard, desk -->
  <rect x="380" y="242" width="40" height="22" fill="#3b4261"/>
  <rect x="336" y="262" width="128" height="8" rx="4" fill="#414868"/>
  <rect x="270" y="278" width="260" height="20" rx="6" fill="#2f334d" stroke="#3b4261"/>
  <g fill="#565f89">
    <rect x="282" y="283" width="22" height="4" rx="2"><animate attributeName="fill" values="#565f89;#7aa2f7;#565f89" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="312" y="283" width="22" height="4" rx="2"><animate attributeName="fill" values="#565f89;#7aa2f7;#565f89" dur="0.9s" begin=".3s" repeatCount="indefinite"/></rect>
    <rect x="342" y="283" width="60" height="4" rx="2"/>
    <rect x="410" y="283" width="22" height="4" rx="2"><animate attributeName="fill" values="#565f89;#bb9af7;#565f89" dur="0.9s" begin=".6s" repeatCount="indefinite"/></rect>
    <rect x="440" y="283" width="22" height="4" rx="2"/>
    <rect x="300" y="291" width="190" height="3" rx="1.5"/>
  </g>
  <rect x="120" y="300" width="560" height="4" rx="2" fill="#3b4261"/>

  <!-- coffee mug + steam -->
  <rect x="590" y="262" width="36" height="38" rx="6" fill="#e0af68"/>
  <path d="M626 270 q16 0 16 12 q0 12 -16 12" fill="none" stroke="#e0af68" stroke-width="5"/>
  <g fill="none" stroke="#c0caf5" stroke-width="2.5" stroke-linecap="round" opacity=".7">
    <path d="M600 254 q-6 -8 0 -16 q6 -8 0 -16"><animate attributeName="opacity" values="0;.8;0" dur="2.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -6" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M614 254 q-6 -8 0 -16 q6 -8 0 -16"><animate attributeName="opacity" values="0;.8;0" dur="2.6s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -6" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- floating dev symbols -->
  <g font-family="Consolas, Menlo, monospace" font-weight="bold" font-size="26">
    <text x="70" y="240" fill="#7aa2f7">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -150" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></text>
    <text x="130" y="260" fill="#bb9af7">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -170" dur="7s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="1.5s" repeatCount="indefinite"/></text>
    <text x="680" y="250" fill="#9ece6a">#<animateTransform attributeName="transform" type="translate" values="0 0;0 -160" dur="6.5s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin=".8s" repeatCount="indefinite"/></text>
    <text x="725" y="270" fill="#e0af68">C#<animateTransform attributeName="transform" type="translate" values="0 0;0 -180" dur="7.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="2.5s" repeatCount="indefinite"/></text>
    <text x="40" y="270" fill="#f7768e">;<animateTransform attributeName="transform" type="translate" values="0 0;0 -140" dur="5.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="3s" repeatCount="indefinite"/></text>
  </g>
</svg>
